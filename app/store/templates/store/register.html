{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}

{% block content %}
  <div class="card-box auth-box">
    <h1 class="page-title" style="font-size: 1.5rem;">Регистрация</h1>

    <form id="store-register-form">
      <div class="form-group">
        <label for="reg-name">Никнейм / Имя *</label>
        <input type="text" id="reg-name" name="name" class="input" required />
      </div>

      <div class="form-group">
        <label for="reg-email">Email *</label>
        <input type="email" id="reg-email" name="email" class="input" required />
      </div>

      <div class="form-group">
        <label for="reg-phone">Телефон</label>
        <input type="text" id="reg-phone" name="phone" class="input" placeholder="+7 (999) 000-00-00" />
      </div>

      <div class="form-group">
        <label for="reg-password">Пароль *</label>
        <input type="password" id="reg-password" name="password" class="input" required />
      </div>

      <div id="form-error" class="form-error"></div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Создать аккаунт</button>
    </form>

    <p style="margin-top: 16px; font-size: 0.9rem; color: var(--muted);">
      Уже есть аккаунт? <a href="/login" style="color: var(--primary);">Войти</a>
    </p>
  </div>
{% endblock %}
