{% extends "base.html" %}
{% block title %}Вход в аккаунт{% endblock %}

{% block content %}
  <div class="card-box auth-box">
    <h1 class="page-title" style="font-size: 1.5rem;">Вход</h1>

    <form id="store-login-form" data-next="{{ next_url }}">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" class="input" required />
      </div>

      <div class="form-group">
        <label for="login-password">Пароль</label>
        <input type="password" id="login-password" name="password" class="input" required />
      </div>

      <div id="form-error" class="form-error"></div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
    </form>

    <p style="margin-top: 16px; font-size: 0.9rem; color: var(--muted);">
      Нет аккаунта? <a href="/register" style="color: var(--primary);">Зарегистрироваться</a>
    </p>
  </div>
{% endblock %}
